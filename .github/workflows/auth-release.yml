name: Auth Service Release Flow
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend/Personage.Auth
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: authdb-test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Install goose
        run: curl -fsSL https://raw.githubusercontent.com/pressly/goose/master/install.sh | sh

      - name: Run migrations
        run: goose -dir migrations postgres "postgres://postgres:postgres@localhost:5432/authdb-test?sslmode=disable" up

      - name: Setup yc
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i /opt/yc -n
          echo '${{ secrets.YC_SERVICE_KEY }}' > sa-key.json
          /opt/yc/bin/yc config set service-account-key sa-key.json
          /opt/yc/bin/yc config set folder-id ${{ secrets.YC_FOLDER_ID }}

      - name: Fetch YC IAM token
        run: echo "YC_TOKEN=$(/opt/yc/bin/yc iam create-token)" >> $GITHUB_ENV

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Run tests
        run: dotnet test --no-restore --verbosity normal

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend/Personage.Auth
    steps:
      - uses: actions/checkout@v6

      - name: Set release version
        run: echo "RELEASE_VERSION=${{ github.run_number }}" >> $GITHUB_ENV

      - name: Setup yc
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i /opt/yc -n
          echo '${{ secrets.YC_SERVICE_KEY }}' > sa-key.json
          /opt/yc/bin/yc config set folder-id ${{ secrets.YC_FOLDER_ID }}
          /opt/yc/bin/yc config set service-account-key sa-key.json

      - name: Login docker
        run: |
          echo $(/opt/yc/bin/yc iam create-token)|docker login --username iam --password-stdin cr.yandex

      - name: Build Docker image
        run: docker build -t cr.yandex/${{ vars.DOCKER_REGISTRY }}/auth:${{ env.RELEASE_VERSION }} --push .

  migrate-up:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend/Personage.Auth
    steps:
      - uses: actions/checkout@v6

      - name: Download goose
        run: curl -fsSL https://raw.githubusercontent.com/pressly/goose/master/install.sh | sh

      - name: Setup yc
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i /opt/yc -n
          echo '${{ secrets.YC_SERVICE_KEY }}' > sa-key.json
          /opt/yc/bin/yc config set service-account-key sa-key.json
          /opt/yc/bin/yc config set folder-id ${{ secrets.YC_FOLDER_ID }}

      - name: Migrate up
        run: |
          echo "Fetching DB_PASSWORD from Yandex Cloud Lockbox..."
          export PGPASSWORD=$(/opt/yc/bin/yc lockbox payload get --id ${{ secrets.POSTGRES_DB_PASSWORD_SECRET_ID }} --key postgresql_password)

          mkdir -p ~/.postgresql && wget "https://storage.yandexcloud.net/cloud-certs/CA.pem" --output-document ~/.postgresql/root.crt && chmod 0600 ~/.postgresql/root.crt

          export GOOSE_DRIVER=postgres
          export GOOSE_DBSTRING="postgres://main@${{ vars.POSTGRES_DB_HOST }}:6432/auth?sslmode=verify-full&target_session_attrs=read-write&sslrootcert=/home/runner/.postgresql/root.crt"
          goose -v -dir "migrations" up

      - name: Success
        run: echo "migrated"

  deploy:
    runs-on: ubuntu-latest
    needs:
      - build
      - migrate-up
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set release version
        run: echo "RELEASE_VERSION=${{ github.run_number }}" >> $GITHUB_ENV

      - name: Setup yc
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i /opt/yc -n
          echo '${{ secrets.YC_SERVICE_KEY }}' > sa-key.json
          /opt/yc/bin/yc config set folder-id ${{ secrets.YC_FOLDER_ID }}
          /opt/yc/bin/yc config set service-account-key sa-key.json

      - name: Get AWS credentials from Yandex Lockbox
        run: |
          echo "🔐 Fetching AWS credentials from Yandex Lockbox..."
          AWS_ACCESS_KEY_ID=$(/opt/yc/bin/yc lockbox payload get --name aws-static --key access_key_id)
          AWS_SECRET_ACCESS_KEY=$(/opt/yc/bin/yc lockbox payload get --name aws-static --key secret_key)
          echo "AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}" >> $GITHUB_ENV
          echo "✅ AWS credentials retrieved successfully"

      - name: Configure Terraform for Yandex Cloud mirror
        run: |
          cat > ~/.terraformrc <<'EOF'
          provider_installation {
            network_mirror {
              url = "https://terraform-mirror.yandexcloud.net/"
              include = ["registry.terraform.io/*/*"]
            }
            direct {
              exclude = ["registry.terraform.io/*/*"]
            }
          }
          EOF

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.3"

      - name: Update image tag in docker-compose
        run: |
          echo "🚀 Deploying auth service"
          echo "   Release version: ${{ env.RELEASE_VERSION }}"

          DOCKER_COMPOSE_FILE="terraform/pods-specs/docker-compose.auth.yml"

          echo "📝 Updating image tag in ${DOCKER_COMPOSE_FILE}..."
          sed -i "s|image: cr.yandex/${{ vars.DOCKER_REGISTRY }}/auth:.*|image: cr.yandex/${{ vars.DOCKER_REGISTRY }}/auth:${{ env.RELEASE_VERSION }}|" "$DOCKER_COMPOSE_FILE"

          echo "✅ Updated docker-compose.yml:"
          cat "$DOCKER_COMPOSE_FILE"

      - name: Configure Git
        run: |
          git config user.email "ci@personage.ru"
          git config user.name "GitHub Actions"

      - name: Terraform Deploy
        working-directory: terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
          YC_CLOUD_ID: ${{ secrets.YC_CLOUD_ID }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
        run: |
          export YC_TOKEN=$(/opt/yc/bin/yc iam create-token)
          echo "🔧 Initializing Terraform..."
          terraform init

          echo "📋 Planning Terraform changes..."
          terraform plan

          echo "📦 Applying Terraform configuration..."
          terraform apply -auto-approve
          echo "✅ Deployment complete!"

      - name: Commit and push changes via PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="ci/update-auth-v${{ env.RELEASE_VERSION }}"

          echo "🌿 Creating branch ${BRANCH}..."
          git checkout -b "$BRANCH"

          echo "💾 Committing release version..."
          git add terraform/pods-specs/docker-compose.auth.yml
          git commit -m "chore: update auth to ${{ env.RELEASE_VERSION }} [skip ci]" || { echo "No changes to commit"; exit 0; }

          echo "📤 Pushing branch to repository..."
          git push origin "$BRANCH"

          echo "📝 Creating pull request..."
          PR_URL=$(gh pr create \
            --title "chore: update auth to ${{ env.RELEASE_VERSION }}" \
            --body "Automated release update for **auth** v${{ env.RELEASE_VERSION }}. Created by the release workflow. [skip ci]" \
            --base "${{ github.ref_name }}" \
            --head "$BRANCH")

          echo "🔀 Merging pull request..."
          gh pr merge "$PR_URL" --squash --admin --delete-branch

          echo "✅ Version ${{ env.RELEASE_VERSION }} is now deployed and committed to ${{ github.ref_name }}"

  publish-release:
    runs-on: ubuntu-latest
    needs: deploy
    environment:
      name: Production
    steps:
      - name: Set release version
        run: echo "RELEASE_VERSION=${{ github.run_number }}" >> $GITHUB_ENV

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-auth-v${{ env.RELEASE_VERSION }}
          name: Release auth v${{ env.RELEASE_VERSION }}
          draft: false
          prerelease: false
