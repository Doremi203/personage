  build:
    needs:
      - codegen
      - test-unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - name: Download codegen results
        uses: actions/download-artifact@v6
        with:
          name: codegen-output
          path: backend

      - name: Set release version
        run: echo "RELEASE_VERSION=${{ github.run_number }}" >> $GITHUB_ENV

      - name: Setup yc
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i /opt/yc -n
          echo '${{ secrets.YC_SERVICE_KEY }}' > sa-key.json
          /opt/yc/bin/yc config set folder-id ${{ secrets.YC_FOLDER_ID }}
          /opt/yc/bin/yc config set service-account-key sa-key.json

      - name: Login docker
        run: |
          echo $(/opt/yc/bin/yc iam create-token)|docker login --username iam --password-stdin cr.yandex

      - name: Build Docker image
        run: docker build --build-arg service=${{ inputs.service_name }} -t cr.yandex/${{ vars.DOCKER_REGISTRY }}/${{ inputs.service_name }}:${{ env.RELEASE_VERSION }} --push . -f go.Dockerfile

  migrate-up:
    runs-on: ubuntu-latest
    needs: test-unit
    if: ${{ inputs.needs_migrations }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend/${{ inputs.service_name }}
    steps:
      - uses: actions/checkout@v6

      - name: Download goose
        if: ${{ inputs.needs_migrations == 'true' }}
        run: curl -fsSL https://raw.githubusercontent.com/pressly/goose/master/install.sh | sh

      - name: Setup yc
        if: ${{ inputs.needs_migrations == 'true' }}
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i /opt/yc -n
          echo '${{ secrets.YC_SERVICE_KEY }}' > sa-key.json
          /opt/yc/bin/yc config set service-account-key sa-key.json
          /opt/yc/bin/yc config set folder-id ${{ secrets.YC_FOLDER_ID }}

      - name: Migrate up
        if: ${{ inputs.needs_migrations == 'true' }}
        run: |
          echo "Fetching DB_PASSWORD from Yandex Cloud Lockbox..."
          export PGPASSWORD=$(/opt/yc/bin/yc lockbox payload get --id ${{ secrets.POSTGRES_DB_PASSWORD_SECRET_ID }} --key postgresql_password)
          
          mkdir -p ~/.postgresql && wget "https://storage.yandexcloud.net/cloud-certs/CA.pem" --output-document ~/.postgresql/root.crt && chmod 0600 ~/.postgresql/root.crt
          
          export GOOSE_DRIVER=postgres
          export GOOSE_DBSTRING="postgres://main@${{ vars.POSTGRES_DB_HOST }}:6432/${{ inputs.db_name }}?sslmode=verify-full&target_session_attrs=read-write&sslrootcert=/home/runner/.postgresql/root.crt"
          goose -v -dir "migrations" up

      - name: Success
        run: echo "migrated"

  deploy:
    runs-on: ubuntu-latest
    needs:
      - build
      - migrate-up
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set release version
        run: echo "RELEASE_VERSION=${{ github.run_number }}" >> $GITHUB_ENV

      - name: Setup yc
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i /opt/yc -n
          echo '${{ secrets.YC_SERVICE_KEY }}' > sa-key.json
          /opt/yc/bin/yc config set folder-id ${{ secrets.YC_FOLDER_ID }}
          /opt/yc/bin/yc config set service-account-key sa-key.json

      - name: Get AWS credentials from Yandex Lockbox
        run: |
          echo "🔐 Fetching AWS credentials from Yandex Lockbox..."
          AWS_ACCESS_KEY_ID=$(/opt/yc/bin/yc lockbox payload get --name aws-static --key access_key_id)
          AWS_SECRET_ACCESS_KEY=$(/opt/yc/bin/yc lockbox payload get --name aws-static --key secret_key)
          echo "AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}" >> $GITHUB_ENV
          echo "✅ AWS credentials retrieved successfully"

      - name: Configure Terraform for Yandex Cloud mirror
        run: |
          cat > ~/.terraformrc <<'EOF'
          provider_installation {
            network_mirror {
              url = "https://terraform-mirror.yandexcloud.net/"
              include = ["registry.terraform.io/*/*"]
            }
            direct {
              exclude = ["registry.terraform.io/*/*"]
            }
          }
          EOF

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.3"

      - name: Update image tag in docker-compose
        run: |
          echo "🚀 Deploying ${{ inputs.service_name }} service"
          echo "   Release version: ${{ env.RELEASE_VERSION }}"
          
          DOCKER_COMPOSE_FILE="terraform/pods-specs/docker-compose.${{ inputs.service_name }}.yml"
          
          echo "📝 Updating image tag in ${DOCKER_COMPOSE_FILE}..."
          sed -i "s|image: cr.yandex/${{ vars.DOCKER_REGISTRY }}/${{ inputs.service_name }}:.*|image: cr.yandex/${{ vars.DOCKER_REGISTRY }}/${{ inputs.service_name }}:${{ env.RELEASE_VERSION }}|" "$DOCKER_COMPOSE_FILE"
          
          echo "✅ Updated docker-compose.yml:"
          cat "$DOCKER_COMPOSE_FILE"

      - name: Configure Git
        run: |
          git config user.email "ci@personage.ru"
          git config user.name "GitHub Actions"

      - name: Terraform Deploy
        working-directory: terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
          YC_CLOUD_ID: ${{ secrets.YC_CLOUD_ID }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
        run: |
          export YC_TOKEN=$(/opt/yc/bin/yc iam create-token)
          echo "🔧 Initializing Terraform..."
          terraform init
          
          echo "📋 Planning Terraform changes..."
          terraform plan
          
          echo "📦 Applying Terraform configuration..."
          terraform apply -auto-approve
          echo "✅ Deployment complete!"

      - name: Commit and push changes via PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="ci/update-${{ inputs.service_name }}-v${{ env.RELEASE_VERSION }}"
          
          echo "🌿 Creating branch ${BRANCH}..."
          git checkout -b "$BRANCH"
          
          echo "💾 Committing release version..."
          git add terraform/pods-specs/docker-compose.go.yml
          git commit -m "chore: update ${{ inputs.service_name }} to ${{ env.RELEASE_VERSION }} [skip ci]" || { echo "No changes to commit"; exit 0; }
          
          echo "📤 Pushing branch to repository..."
          git push origin "$BRANCH"
          
          echo "📝 Creating pull request..."
          PR_URL=$(gh pr create \
            --title "chore: update ${{ inputs.service_name }} to ${{ env.RELEASE_VERSION }}" \
            --body "Automated release update for **${{ inputs.service_name }}** v${{ env.RELEASE_VERSION }}. Created by the release workflow. [skip ci]" \
            --base "${{ github.ref_name }}" \
            --head "$BRANCH")
          
          echo "🔀 Merging pull request..."
          gh pr merge "$PR_URL" --squash --admin --delete-branch
          
          echo "✅ Version ${{ env.RELEASE_VERSION }} is now deployed and committed to ${{ github.ref_name }}"

  publish-release:
    runs-on: ubuntu-latest
    needs: deploy
    environment:
      name: Production
    steps:
      - name: Set release version
        run: echo "RELEASE_VERSION=${{ github.run_number }}" >> $GITHUB_ENV

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ inputs.service_name }}-v${{ env.RELEASE_VERSION }}
          name: Release ${{ inputs.service_name }} v${{ env.RELEASE_VERSION }}
          draft: false
          prerelease: false