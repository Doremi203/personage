name: Go Service Release Flow
on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
        description: "Service name (e.g. tasker, notificator)"
      db_name:
        required: false
        type: string
        description: "Database name for migrations"
      needs_migrations:
        required: false
        type: string
        description: "Service need for migrations"
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  codegen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/codegen
      - name: Upload codegen results
        uses: actions/upload-artifact@v6
        with:
          name: codegen-output
          path: backend

  test-unit:
    needs: codegen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend/${{ inputs.service_name }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Download codegen results
        uses: actions/download-artifact@v4
        with:
          name: codegen-output
          path: backend

      - name: Run tests
        run: BASE_MIGRATIONS_PATH=${{ github.workspace }}/backend go test ./... -race

