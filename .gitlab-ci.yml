stages:
  - build
  - test
  - deploy

variables:
  DOTNET_VERSION: "9.0"

build:
  stage: build
  script:
    - echo "Hello, $GITLAB_USER_LOGIN!"

test-personage-auth:
  stage: test
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: ""
    POSTGRES_HOST: "postgres"
    ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=authdb_test;Username=postgres;Password=postgres"
    ASPNETCORE_ENVIRONMENT: "Testing"
  before_script:
    - apk add --no-cache docker-compose
    - cd backend/Personage.Auth
    - docker-compose -f docker-compose.test.yml up -d postgres
    - sleep 10
    - docker-compose -f docker-compose.test.yml ps
  script:
    - docker-compose -f docker-compose.test.yml run --rm tests
  after_script:
    - docker-compose -f docker-compose.test.yml down -v
  artifacts:
    when: always
    reports:
      junit:
        - backend/Personage.Auth/TestResults/*.xml
    paths:
      - backend/Personage.Auth/TestResults/
  only:
    changes:
      - backend/Personage.Auth/**/*
    refs:
      - merge_requests
      - main
      - develop
      - master
  allow_failure: false

test:
  stage: test
  script:
    - echo "This job tests something"

deploy:
  stage: deploy
  script:
    - echo "This job deploys something from the $CI_COMMIT_BRANCH branch."
  environment: production