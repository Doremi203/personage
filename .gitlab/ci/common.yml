default:
  interruptible: true
  retry:
    max: 1
    when: runner_system_failure

.load_secret:
  before_script:
    - !reference [.get_iam_token]
    - |
      load_secret() {
        local secret_id=$1
        local secret_key=$2
        local env_var=$3
      
        local token=$(get_iam_token)
      
        local secret_json=`curl --silent --header "Authorization: Bearer $token" \
          https://payload.lockbox.api.cloud.yandex.net/lockbox/v1/secrets/$secret_id/payload`
      
        local secret_value=`echo $secret_json | jq -rMc ".entries[] | select(.key | contains(\"$secret_key\")) | .textValue"`
      
        export $env_var="$secret_value"
        echo "✓ Loaded secret '$secret_key' into \$$env_var"
      }