.get_iam_token:
  before_script:
    - |
      echo "🔑 Getting Yandex Cloud IAM token..."
      
      IAM_JSON=$(curl -sS -H "Metadata-Flavor: Google" \
        http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/token)
      
      TOKEN=$(echo "$IAM_JSON" | jq -r '.access_token')
      EXPIRES_IN=$(echo "$IAM_JSON" | jq -r '.expires_in')
      
      if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
        echo "❌ Failed to get IAM token"
        exit 1
      fi
      
      export YC_IAM_TOKEN="$TOKEN"
      echo "✅ IAM token obtained (expires in ${EXPIRES_IN}s)"