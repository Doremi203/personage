syntax = "proto3";

package auth;

option go_package = "github.com/Doremi203/personage/backend/libs/go/auth/gen/api/auth";

import "google/protobuf/timestamp.proto";

enum ServiceType {
  ServiceType_Unknown = 0;
  ServiceType_Gmail = 1;
  ServiceType_Telegram = 2;
}

message GmailTokens {
  string access_token = 1;
  string refresh_token = 2;
  google.protobuf.Timestamp expires_at = 3;
  string gmail_email = 4;
}

message TelegramSession {
  string session_string = 1;
}
