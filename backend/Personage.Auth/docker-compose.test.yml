version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: authdb_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrations:
    image: mcr.microsoft.com/dotnet/sdk:9.0
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=authdb_test;Username=postgres;Password=postgres;Pooling=false"
      ASPNETCORE_ENVIRONMENT: "Testing"
    volumes:
      - .:/app
      - nuget-packages:/root/.nuget/packages
    working_dir: /app
    command: >
      sh -c "
      dotnet restore &&
      dotnet build &&
      dotnet run --project Personage.Auth.Api -- migrate"

  tests:
    image: mcr.microsoft.com/dotnet/sdk:9.0
    depends_on:
      - postgres
      - migrations
    environment:
      POSTGRES_HOST: "postgres"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=authdb_test;Username=postgres;Password=postgres;Pooling=false"
      ASPNETCORE_ENVIRONMENT: "Testing"
    volumes:
      - .:/app
      - nuget-packages:/root/.nuget/packages
    working_dir: /app
    command: >
      sh -c "
      dotnet restore &&
      dotnet build &&
      dotnet test --logger 'trx;LogFileName=test-results.trx' --results-directory TestResults"
volumes:
  nuget-packages: