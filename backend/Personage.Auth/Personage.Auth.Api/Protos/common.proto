syntax = "proto3";

package auth;

option csharp_namespace = "Personage.Auth.Api.Grpc.Common";

import "google/protobuf/timestamp.proto";

enum ServiceType {
  ServiceType_Unknown = 0;
  ServiceType_Gmail = 1;
}

message GmailTokens {
  string access_token = 1;
  string refresh_token = 2;
  google.protobuf.Timestamp expires_at = 3;
  string gmail_email = 4;
}
