syntax = "proto3";

package auth;

option csharp_namespace = "Personage.Auth.Api.Grpc.Common";

import "google/protobuf/timestamp.proto";

enum ServiceType {
  ServiceType_Unknown = 0;
  ServiceType_Gmail = 1;
  ServiceType_Telegram = 2;
  ServiceType_GoogleCalendar = 3;
}

message GmailTokens {
  string access_token = 1;
  string refresh_token = 2;
  google.protobuf.Timestamp expires_at = 3;
  string gmail_email = 4;
}

message GoogleCalendarTokens {
  string access_token = 1;
  string refresh_token = 2;
  google.protobuf.Timestamp expires_at = 3;
  string gmail_email = 4;
}

message ChatInfo {
  int64 id = 1;
  string name = 2;
  bool is_active = 3;
}

message TelegramSession {
  string session_string = 1;
  repeated ChatInfo chats = 2;
}