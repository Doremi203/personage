syntax = "proto3";

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Personage.Auth.Api.Grpc";

package ping;

service TestService {
  rpc Ping (PingRequest) returns (PingResponse);
}

message PingRequest {}

message PingResponse {
  string message = 1;
  google.protobuf.Timestamp moment = 2;
}