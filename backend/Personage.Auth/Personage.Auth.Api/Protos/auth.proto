syntax = "proto3";

package auth;

option csharp_namespace = "Personage.Auth.Api.Grpc";

import "google/protobuf/timestamp.proto";

service AuthService {
  rpc GetGmailTokens(GetGmailTokensRequest) returns (GmailTokens) {}
}

message GetGmailTokensRequest {
  string user_email = 1;
}


message GmailTokens {
  string access_token = 1;
  string refresh_token = 2;
  google.protobuf.Timestamp expires_at = 3;
}