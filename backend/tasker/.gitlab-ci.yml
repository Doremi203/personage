include:
  - local: .gitlab/ci/go.yml

.tasker_rules:
  rules:
    - changes:
        - backend/tasker/**/*
        - backend/libs/go/**/*


.tasker:lint:
  stage: lint
  extends:
    - .tasker_rules
    - .go:lint
  variables:
    SERVICE: "tasker"

tasker:build:
  stage: build
  extends:
    - .tasker_rules
  variables:
    SERVICE: "tasker"
    CI_REGISTRY: "cr.yandex/crp77qhpsda1m6ian417"
  before_script:
    - !reference [.get_iam_token, before_script]
    - echo "🔐 Logging into Yandex Container Registry..."
    - echo "${YC_IAM_TOKEN}" | docker login ${CI_REGISTRY} --username iam --password-stdin
    - echo "✅ Logged in successfully"
  script:
    - set -eo pipefail
    - |
      # Определяем тег образа в зависимости от типа пайплайна
      if [ -n "$CI_MERGE_REQUEST_IID" ]; then
        # Для merge request используем специальный тег
        IMAGE_TAG="mr-${CI_MERGE_REQUEST_IID}"
        echo "🔀 Building for Merge Request #${CI_MERGE_REQUEST_IID}"
      elif [ -n "$CI_COMMIT_TAG" ]; then
        # Для релизов используем git tag
        IMAGE_TAG="${CI_COMMIT_TAG}"
        echo "🏷️  Building release: ${CI_COMMIT_TAG}"
      else
        # Fallback на commit SHA
        IMAGE_TAG="${CI_COMMIT_SHA}"
        echo "📦 Building commit: ${CI_COMMIT_SHA}"
      fi
    - cd "$CI_PROJECT_DIR/backend"
    - FULL_IMAGE_TAG="${CI_REGISTRY}/$SERVICE:$IMAGE_TAG"
    - |
      echo "🐳 Building Docker image for service: $SERVICE"
      echo "   Tag: $IMAGE_TAG"
      docker build \
        -f go.Dockerfile \
        --build-arg service="$SERVICE" \
        -t "$FULL_IMAGE_TAG" \
        .
      
      echo "📤 Pushing image..."
      docker push "$FULL_IMAGE_TAG"
      
      echo "✅ Build and push complete"
      echo "   Image: $FULL_IMAGE_TAG"
      docker rmi "$FULL_IMAGE_TAG" || true
      echo "🧹 Removed local image"
  artifacts:
    reports:
      dotenv: build.env
    expire_in: 1 day
  after_script:
    - |
      # Сохраняем тег образа для использования в deploy
      if [ -n "$CI_MERGE_REQUEST_IID" ]; then
        IMAGE_TAG="mr-${CI_MERGE_REQUEST_IID}"
      elif [ -n "$CI_COMMIT_TAG" ]; then
        IMAGE_TAG="${CI_COMMIT_TAG}"
      else
        IMAGE_TAG="${CI_COMMIT_SHA}"
      fi
      echo "TASKER_IMAGE_TAG=${IMAGE_TAG}" >> build.env

tasker:test:
  stage: build
  extends:
    - .tasker_rules
    - .go:test
  variables:
    SERVICE: "tasker"

tasker:deploy:
  stage: deploy
  variables:
    SERVICE: "tasker"
  rules:
    # Деплой только для git тегов (релизов)
    - if: $CI_COMMIT_TAG
  dependencies:
    - tasker:build
  before_script:
    - cd "$CI_PROJECT_DIR"
    - git config user.email "ci@persomanage.ru"
    - git config user.name "GitLab CI"
  script:
    - set -eo pipefail
    - |
      echo "🚀 Deploying tasker service"
      echo "   Release tag: ${CI_COMMIT_TAG}"
      echo "   Image tag: ${TASKER_IMAGE_TAG}"
      
      # Обновляем docker-compose.yml напрямую (GitOps подход)
      DOCKER_COMPOSE_FILE="terraform/pods-specs/docker-compose.go.yml"
      
      echo "📝 Updating image tag in ${DOCKER_COMPOSE_FILE}..."
      sed -i "s|image: cr.yandex/crp77qhpsda1m6ian417/tasker:.*|image: cr.yandex/crp77qhpsda1m6ian417/tasker:${TASKER_IMAGE_TAG}|" "$DOCKER_COMPOSE_FILE"
      
      echo "✅ Updated docker-compose.yml:"
      cat "$DOCKER_COMPOSE_FILE"
      
      # Переходим в директорию Terraform
      cd terraform
      
      export AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID}"
      export AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY}"
      export YC_CLOUD_ID="${YC_CLOUD_ID}"
      export YC_FOLDER_ID="${YC_FOLDER_ID}"
      
      echo "ID облака"
      echo $YC_CLOUD_ID
      
      # Инициализируем Terraform
      echo "🔧 Initializing Terraform..."
      terraform init
      
      # Применяем изменения
      echo "📦 Applying Terraform configuration..."
      terraform apply -auto-approve
      
      echo "✅ Deployment complete!"
      
      # Коммитим и пушим только после успешного apply
      cd "$CI_PROJECT_DIR"
      
      echo "💾 Committing release version to Git..."
      git add "$DOCKER_COMPOSE_FILE"
      git commit -m "chore: update tasker to ${TASKER_IMAGE_TAG} [skip ci]" || echo "No changes to commit"
      
      echo "📤 Pushing changes to repository..."
      git push origin HEAD:${CI_DEFAULT_BRANCH}
      
      echo "   Version ${TASKER_IMAGE_TAG} is now deployed and committed to Git"
