syntax = "proto3";

package api.sqs.connector_events;

option go_package = "github.com/amoguscorp/personage/backend/tasker/gen/api/sqs/connectorevents";

message Event {
  string id = 1;
  string user_id = 2;
  ConnectorType connector_type = 3;
  string occurred_at = 4;
}

enum ConnectorType {
  CONNECTOR_TYPE_UNKNOWN = 0;
  CONNECTOR_TYPE_GMAIL = 1;
  CONNECTOR_TYPE_TELEGRAM = 2;
  CONNECTOR_TYPE_GOOGLE_CALENDAR = 3;
}